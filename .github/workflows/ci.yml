name: CI

on:
  push:
    # Only on main to prevent duplicate CI runs during a push with a PR.
    # Used to have job if gates (push to main, or any PR), but this meant
    # workflows would spin up, only to then skip a job with an 'if'.
    branches: [main]
  pull_request:

permissions:
  contents: read # for checkout

env:
  NODE_VER: 24

jobs:

  quality_checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Use Node.js (LTS)
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VER }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check spelling
        run: npm run spell
      - name: Lint all files
        run: npm run lint
      - name: Test (build, run tests, and coverage report)
        run: npm run test:unit:coverage
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: Unit - Test Coverage Report
          path: docs/test-results/specs/coverage
          retention-days: 30

  playwright-version:
    name: Resolve Playwright Version
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Only the lockfile is needed to resolve the version
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false
      - id: version
        # Read the resolved version from the lockfile so the container image below can never drift from what's installed
        run: |
          VERSION=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  e2e-tests:
    name: E2E Tests
    needs: [playwright-version]
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      # Use official Playwright image rather than downloading/installing Playwright browsers (which can be flakey and slower in CIs)
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}
      options: --init --ipc=host
    env:
      # Firefox refuses to launch in the container otherwise, since $HOME isn't owned by the running user (root)
      HOME: /root
    steps:
      - uses: actions/checkout@v6
      - name: Mark workspace as a safe git directory
        # The Qlty CLI uses libgit2 (via the git2 Rust crate) to read commit metadata, which
        # enforces its own ownership check and doesn't reliably pick up what actions/checkout
        # configures, so the checkout is rejected as "not owned by current user" without this.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install build tools
        # The Playwright image is minimal and doesn't include make/rsync (used by `npm run build:test`)
        # or xz-utils (needed by the Qlty CLI installer's .tar.xz archive)
        run: apt-get update && apt-get install -y --no-install-recommends make rsync xz-utils
      - name: Build (allowing install for E2E browser tests)
        run: npm run build:test
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: E2E - Playwright Testing Report
          path: docs/test-results/e2e/playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: E2E - Monocart Testing and Coverage Report
          path: docs/test-results/e2e/monocart-report/
          retention-days: 30
      - name: Add markdown E2E coverage report to job summary
        run: |
          cat docs/test-results/e2e/monocart-report/coverage/coverage-summary.md >> $GITHUB_STEP_SUMMARY
          cat docs/test-results/e2e/monocart-report/coverage/coverage-details.md >> $GITHUB_STEP_SUMMARY
      - name: Upload coverage report to Qlty
        uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: docs/test-results/e2e/monocart-report/coverage/lcov.info
      - name: Upload coverage report to Codacy
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: docs/test-results/e2e/monocart-report/coverage/lcov.info

  release:
    name: Release
    needs: [quality_checks, e2e-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        # Install dependencies from package.json with specific versions to ensure compatibility/reliability
        run: npm clean-install
      - name: Build # Copy src into `dist/` folder
        run: make
      - name: Release
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          EXTENSION_ID: ${{vars.EXTENSION_ID}}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_CLIENT_ID: ${{secrets.GOOGLE_CLIENT_ID}}
          GOOGLE_CLIENT_SECRET: ${{secrets.GOOGLE_CLIENT_SECRET}}
          GOOGLE_REFRESH_TOKEN: ${{secrets.GOOGLE_REFRESH_TOKEN}}
        run: npx semantic-release
