name: CI

on:
  push:
    # Only on main to prevent duplicate CI runs during a push with a PR.
    # Used to have job if gates (push to main, or any PR), but this meant
    # workflows would spin up, only to then skip a job with an 'if'.
    branches: [main]
  pull_request:

permissions:
  contents: read # for checkout

env:
  NODE_VER: 24

jobs:

  quality_checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Use Node.js (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VER }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check spelling
        run: npm run spell
      - name: Lint all files
        run: npm run lint
      - name: Test (build, run tests, and coverage report)
        run: npm run test:unit:coverage
      - name: Add unit coverage summary to job summary
        # Re-renders a text-summary from the coverage data already collected above (no re-test),
        # since test:unit:coverage's reporters (html/text/lcovonly) don't include a concise one.
        if: ${{ !cancelled() }}
        run: |
          echo "## Coverage Report - Unit Tests" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npx c8 report --reporter=text-summary >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: Unit - Test Coverage Report
          path: docs/test-results/specs/coverage
          retention-days: 30

  playwright-version:
    name: Resolve Playwright Version
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Only the lockfile is needed to resolve the version
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false
      - id: version
        # Read the resolved version from the lockfile so the container image below can never drift from what's installed
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Could not resolve @playwright/test version from package-lock.json" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  e2e-tests:
    name: E2E Tests
    needs: [playwright-version]
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      # Use official Playwright image rather than downloading/installing Playwright browsers (which can be flakey and slower in CIs)
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}
      options: --init --ipc=host
    env:
      # Firefox refuses to launch in the container otherwise, since $HOME isn't owned by the running user (root)
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install build tools
        # The Playwright image is minimal and doesn't include make/rsync, used by `npm run build:test`
        run: apt-get update && apt-get install -y --no-install-recommends make rsync
      - name: Build (allowing install for E2E browser tests)
        run: npm run build:test
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: E2E - Playwright Testing Report
          path: docs/test-results/e2e/playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: E2E - Monocart Testing and Coverage Report
          path: docs/test-results/e2e/monocart-report/
          retention-days: 30

  coverage-upload:
    name: Coverage Upload
    needs: [e2e-tests, quality_checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read # for checkout
      actions: read # to download the artifacts uploaded by e2e-tests and quality_checks
    # Deliberately kept out of the Playwright container: it's minimal (no gh, no xz) and root-owned,
    # which needed fragile workarounds (installing gh via a third-party apt repo, xz-utils, a git
    # safe.directory override) purely to satisfy this reporting step, not the E2E tests themselves.
    # ubuntu-latest already has gh/xz preinstalled and normal non-root file ownership, so none of that
    # is needed here - report on a plain runner, only run the browsers where they're actually required.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: E2E - Monocart Testing and Coverage Report
          path: docs/test-results/e2e/monocart-report
      - uses: actions/download-artifact@v8
        with:
          name: Unit - Test Coverage Report
          path: docs/test-results/specs/coverage
      - name: Add markdown E2E coverage report to job summary
        # Unit coverage gets its own summary section in the Quality Checks job instead, since c8
        # only produces an lcov report here, not a markdown one - but both are combined below when
        # uploading to Qlty.
        run: |
          cat docs/test-results/e2e/monocart-report/coverage/coverage-summary.md >> $GITHUB_STEP_SUMMARY
          cat docs/test-results/e2e/monocart-report/coverage/coverage-details.md >> $GITHUB_STEP_SUMMARY
      - name: Upload coverage report to Qlty
        # Previously only uploaded E2E coverage; the action accepts a comma-separated file list
        # and combines them server-side, so unit coverage counts toward the total too now.
        uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: docs/test-results/specs/coverage/lcov.info,docs/test-results/e2e/monocart-report/coverage/lcov.info

  release:
    name: Release
    needs: [quality_checks, e2e-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        # Install dependencies from package.json with specific versions to ensure compatibility/reliability
        run: npm clean-install
      - name: Build # Copy src into `dist/` folder
        run: make
      - name: Release
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          EXTENSION_ID: ${{vars.EXTENSION_ID}}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_CLIENT_ID: ${{secrets.GOOGLE_CLIENT_ID}}
          GOOGLE_CLIENT_SECRET: ${{secrets.GOOGLE_CLIENT_SECRET}}
          GOOGLE_REFRESH_TOKEN: ${{secrets.GOOGLE_REFRESH_TOKEN}}
        run: npx semantic-release
